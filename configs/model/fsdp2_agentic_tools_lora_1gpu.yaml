# EXPERIMENTAL — Model update config for the agentic tool-use task: the async
# LoRA updater (fsdp2_async_lora_1gpu.yaml) with max_completion_length matched
# to the tool engine's max_gen_len (agentic_engine_tools.yaml). dr_grpo divides
# the loss by this cap, so a mismatch silently rescales the learning rate.
model_path: "Qwen/Qwen3-0.6B-Base"
torch_dtype: "float32"  # FP32 master + bf16 compute (FSDP2 mixed-precision)
model_init_kwargs:
  trust_remote_code: false
fsdp_size: 1
fsdp_wrap_granularity: "layer"
fsdp_cpu_offload: false
fsdp_reshard_after_forward: true
fsdp_activation_checkpointing: true
fsdp_mixed_precision: true
fsdp_sharding_strategy: "FULL_SHARD"
fsdp_grad_reduce_dtype: "bfloat16"
fsdp_root_reshard_after_forward: true
disable_dropout: true
torch_compile: false
# --- PEFT / LoRA (the async weight-sync primitive: ~9 MB adapter hot-swap) ---
peft_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules: ["q_proj", "v_proj"]
lora_bias: "none"
# --- GRPO loss (validated mainline knobs) ---
kl_coef: 0.0
clip_range_low: 0.2
clip_range_high: 0.2
temperature: 0.7
loss_reduction: "dr_grpo"
importance_sampling_level: "token"
engine_is_correction: true
engine_is_mode: "token_mask"
engine_is_cap: 3.0
max_completion_length: 512
# --- Optimizer (LoRA-tuned LR, matches the validated LoRA runs) ---
learning_rate: 1.0e-4
weight_decay: 0.0
max_grad_norm: 1.0
optim: "adamw"
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-8
lr_scheduler_type: "cosine"
warmup_ratio: 0.05
warmup_steps: 0
# --- Batch: one popped buffer batch = one optimizer step (GAS=1 mandatory) ---
gradient_accumulation_steps: 1
micro_batch_size: 4
node_id: "model"
